<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Diagrama do Fence: apps de Windows e Android falam com o servidor por HTTPS e WebSocket e com o LiveKit por WebRTC; o servidor emite o passe da sala e consulta as integrações.">
<defs>
<style>
@font-face { font-family: C7; src: url(data:font/woff2;base64,) format('woff2'); }
.t { font-family: C7, Georgia, serif; font-size: 21px; letter-spacing: 1.5px; fill: #ece6f6; }
.d { font-family: Georgia, serif; font-size: 16px; fill: #a197b8; }
.r { font-family: Georgia, serif; font-style: italic; font-size: 15px; fill: #c9b8fb; }
.http { stroke: #c9b8fb; stroke-width: 1.6; fill: none; }
.rtc { stroke: #8b5cf6; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; animation: fluir 1.4s linear infinite; }
@keyframes fluir { to { stroke-dashoffset: -26; } }
@media (prefers-reduced-motion: reduce) { .rtc { animation: none; } }
</style>
<marker id="ph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9b8fb"/></marker>
<marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="1200" height="440" rx="18" fill="#08050f"/>

<!-- conta, chat e presença -->
<path class="http" d="M360 115 H466" marker-end="url(#ph)"/>
<path class="http" d="M360 320 C420 320 410 150 466 150" marker-end="url(#ph)"/>
<!-- mídia -->
<path class="rtc" d="M364 355 H466" marker-start="url(#pr)" marker-end="url(#pr)"/>
<path class="rtc" d="M364 150 C420 150 410 300 466 300" marker-start="url(#pr)" marker-end="url(#pr)"/>
<!-- passe da sala -->
<path class="http" d="M620 180 V266" marker-end="url(#ph)"/>
<text class="r" x="634" y="228">passe da sala</text>
<!-- integrações -->
<path class="http" d="M770 115 H876" marker-end="url(#ph)"/>

<rect x="40" y="50" width="320" height="130" rx="14" fill="#130c22" stroke="#3a2862" stroke-width="1.5"/>
<text class="t" x="62" y="90">APP DE WINDOWS</text>
<text class="d" x="62" y="120">Electron e React</text>
<text class="d" x="62" y="144">Rust na sobreposição, C++ no áudio</text>
<rect x="40" y="270" width="320" height="130" rx="14" fill="#130c22" stroke="#3a2862" stroke-width="1.5"/>
<text class="t" x="62" y="310">APP ANDROID</text>
<text class="d" x="62" y="340">Expo e React Native</text>
<text class="d" x="62" y="364">mesmo visual do PC</text>
<rect x="470" y="50" width="300" height="130" rx="14" fill="#130c22" stroke="#3a2862" stroke-width="1.5"/>
<text class="t" x="492" y="90">SERVIDOR</text>
<text class="d" x="492" y="120">Node, Express, Caddy</text>
<text class="d" x="492" y="144">argon2, JWT, TOTP</text>
<rect x="470" y="270" width="300" height="130" rx="14" fill="#130c22" stroke="#8b5cf6" stroke-width="1.5"/>
<text class="t" x="492" y="310">LIVEKIT</text>
<text class="d" x="492" y="340">SFU de voz, câmera e tela</text>
<text class="d" x="492" y="364">uma porta UDP</text>
<rect x="880" y="50" width="280" height="130" rx="14" fill="#130c22" stroke="#3a2862" stroke-width="1.5"/>
<text class="t" x="902" y="90">INTEGRAÇÕES</text>
<text class="d" x="902" y="120">Riot, Steam, FACEIT,</text>
<text class="d" x="902" y="144">Gamers Club, Allstar, Spotify</text>

<g transform="translate(880 290)">
  <path class="http" d="M0 10 H56" marker-end="url(#ph)"/>
  <text class="d" x="72" y="15">conta, chat, presença</text>
  <path class="rtc" d="M0 50 H56" marker-end="url(#pr)"/>
  <text class="d" x="72" y="55">voz, câmera e tela</text>
  <text class="r" x="0" y="96">A mídia não passa pelo servidor.</text>
</g>
</svg>